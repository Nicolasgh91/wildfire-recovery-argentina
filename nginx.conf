# =============================================================================
# ForestGuard - Nginx Reverse Proxy Configuration
# Version: 2.1.1
# Last updated: 2026-02-21
#
# Applied improvements:
# - Docker DNS resolver for dynamic upstream re-resolution
# - Variable-based proxy_pass for per-request DNS lookup
# - WebSocket-safe Connection header via map
# - Fixed invalid nested location block
# - Basic rate limiting and proxy timeout tuning
# =============================================================================

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Extended logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml+rss
               image/svg+xml;

    # =========================================================================
    # Docker DNS resolver strategy:
    # Nginx runs inside Docker Compose and resolves service names (frontend/api)
    # through Docker DNS for dynamic upstream re-resolution.
    # =========================================================================
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Set Connection header only when Upgrade is present (WebSocket-safe).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Buffer sizes
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 24k;

    # =========================================================================
    # HTTP server - redirect to HTTPS + ACME challenge
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name forestguard.freedynamicdns.org;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Health check for external monitoring (no redirect)
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # =========================================================================
    # HTTPS server - Main application
    # =========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name forestguard.freedynamicdns.org;

        # SSL Configuration (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/forestguard.freedynamicdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/forestguard.freedynamicdns.org/privkey.pem;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # SSL session cache
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # OCSP Stapling - disabled because current cert lacks OCSP URL
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # ssl_trusted_certificate /etc/letsencrypt/live/forestguard.freedynamicdns.org/chain.pem;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

        # Max upload size
        client_max_body_size 10M;

        # Connection limits
        limit_conn conn_limit 20;

        # =====================================================================
        # Health, docs and OpenAPI (API upstream)
        # =====================================================================
        location = /health {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream/health;
            proxy_set_header Host $host;
            access_log off;
        }

        location = /docs {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /redoc {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /openapi.json {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache OpenAPI spec
            expires 5m;
            add_header Cache-Control "public";
        }

        # =====================================================================
        # API routes - dynamic DNS and explicit precedence over regex locations
        # =====================================================================
        location ^~ /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # API rate limiting
            limit_req zone=api_limit burst=50 nodelay;

            # WebSocket-safe upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Longer timeouts for analysis operations
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # =====================================================================
        # Frontend static assets (cacheable)
        # =====================================================================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Keep same general traffic limiting behavior
            limit_req zone=general_limit burst=100 nodelay;

            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # =====================================================================
        # Frontend SPA catch-all
        # =====================================================================
        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Rate limiting
            limit_req zone=general_limit burst=100 nodelay;

            # No cachear index.html para que el browser siempre obtenga
            # los nuevos nombres de bundles generados por Vite tras cada deploy.
            add_header Cache-Control "no-cache";
        }

        # =====================================================================
        # Deny access to sensitive files
        # =====================================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ \.(env|git|sql|bak|log)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # =====================================================================
        # Error pages
        # =====================================================================
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
