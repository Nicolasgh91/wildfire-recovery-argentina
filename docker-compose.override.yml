# Override for local development: build frontend locally instead of pulling.
# This file is automatically loaded by docker compose alongside docker-compose.yml.
#
# For production on the 1 GB VM, rename or delete this file so that
# docker-compose.yml can use a pre-built image from GHCR instead:
#   image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/frontend:latest
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
