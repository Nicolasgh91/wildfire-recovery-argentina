# Docker Compose override for SSL development
# Use this when you need to generate initial SSL certificates
# Usage: docker compose -f docker-compose.yml -f docker-compose.ssl.yml up

services:
  nginx:
    # Override nginx config for initial certificate generation
    volumes:
      - ./nginx-temp.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot
    # Remove SSL certificate mounts for initial setup
    # - ./certbot/conf:/etc/letsencrypt  # Commented out for initial setup

  certbot:
    # Override certbot for initial certificate generation only
    entrypoint: ["certbot", "certonly", "--webroot", "--webroot-path=/var/www/certbot", "--email", "${SSL_EMAIL:-admin@forestguard.freedynamicdns.org}", "--agree-tos", "--no-eff-email", "-d", "${SSL_DOMAIN:-forestguard.freedynamicdns.org}"]
    # Renewal is handled by host cron/systemd using scripts/renew-ssl-cron.sh
