services:
  # PostgreSQL + PostGIS (via Supabase/remote)
  # Configurado por variable de entorno DB_HOST
  
  redis:
    image: redis:7-alpine
    container_name: forestguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - forestguard
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/api:latest
    container_name: forestguard-api
    restart: unless-stopped
    environment:
      # Base de datos
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # Storage — OCI es el backend activo
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_REPORTS: ${STORAGE_BUCKET_REPORTS}
      STORAGE_BUCKET_CERTIFICATES: ${STORAGE_BUCKET_CERTIFICATES}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}

      # OCI Object Storage (S3-compatible — principal)
      OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL}
      OCI_S3_ACCESS_KEY: ${OCI_S3_ACCESS_KEY}
      OCI_S3_SECRET_KEY: ${OCI_S3_SECRET_KEY}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-}
      OCI_CONFIG_FILE: /home/opc/.oci/config

      # Google Earth Engine (independiente del storage)
      GEE_PROJECT_ID: ${GEE_PROJECT_ID:-}
      GEE_SERVICE_ACCOUNT_EMAIL: ${GEE_SERVICE_ACCOUNT_EMAIL:-}
      GEE_PRIVATE_KEY_PATH: ${GEE_PRIVATE_KEY_PATH:-/run/secrets/gee-service-account.json}

      # Celery/Redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      
      # Aplicación
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY}

      # Auth — API Key + Supabase JWT
      API_KEY: ${API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
    
    volumes:
      - ${GCP_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ~/.oci:/home/opc/.oci:ro
    
    ports:
      - "8000:8000"
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard
      
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
    
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Worker 1: Ingestion (descarga FIRMS)
  worker-ingestion:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/worker:latest
    container_name: forestguard-worker-ingestion
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_REPORTS: ${STORAGE_BUCKET_REPORTS}
      STORAGE_BUCKET_CERTIFICATES: ${STORAGE_BUCKET_CERTIFICATES}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      
      OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL}
      OCI_S3_ACCESS_KEY: ${OCI_S3_ACCESS_KEY}
      OCI_S3_SECRET_KEY: ${OCI_S3_SECRET_KEY}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-}
      OCI_CONFIG_FILE: /home/opc/.oci/config
      
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      
      FIRMS_API_KEY: ${FIRMS_API_KEY}
      
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      PYTHONPATH: /app
    
    volumes:
      - ${GCP_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ~/.oci:/home/opc/.oci:ro
      - ./scripts:/app/scripts:ro
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    
    command: >
      bash -c "sleep 15 && 
      celery -A workers.celery_app worker --loglevel=info --queues=ingestion --concurrency=2"
    healthcheck:
      test: [ "CMD-SHELL", "celery -A workers.celery_app inspect ping --timeout=10 2>/dev/null || pgrep -f 'celery.*worker' || exit 1" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Worker 2: Clustering (DBSCAN)
  worker-clustering:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/worker:latest
    container_name: forestguard-worker-clustering
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_REPORTS: ${STORAGE_BUCKET_REPORTS}
      STORAGE_BUCKET_CERTIFICATES: ${STORAGE_BUCKET_CERTIFICATES}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      
      OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL}
      OCI_S3_ACCESS_KEY: ${OCI_S3_ACCESS_KEY}
      OCI_S3_SECRET_KEY: ${OCI_S3_SECRET_KEY}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-}
      OCI_CONFIG_FILE: /home/opc/.oci/config
      
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      PYTHONPATH: /app
    
    volumes:
      - ${GCP_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ~/.oci:/home/opc/.oci:ro
      - ./scripts:/app/scripts:ro
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    
    command: >
      bash -c "sleep 25 && 
      celery -A workers.celery_app worker --loglevel=info --queues=clustering --concurrency=2"
    healthcheck:
      test: [ "CMD-SHELL", "celery -A workers.celery_app inspect ping --timeout=10 2>/dev/null || pgrep -f 'celery.*worker' || exit 1" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Worker 3: Analysis (carousel + recovery + destruction)
  worker-analysis:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/worker:latest
    container_name: forestguard-worker-analysis
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_REPORTS: ${STORAGE_BUCKET_REPORTS}
      STORAGE_BUCKET_CERTIFICATES: ${STORAGE_BUCKET_CERTIFICATES}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      
      OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL}
      OCI_S3_ACCESS_KEY: ${OCI_S3_ACCESS_KEY}
      OCI_S3_SECRET_KEY: ${OCI_S3_SECRET_KEY}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-}
      OCI_CONFIG_FILE: /home/opc/.oci/config
      
      # Google Earth Engine (requerido para carousel)
      GEE_PROJECT_ID: ${GEE_PROJECT_ID:-}
      GEE_SERVICE_ACCOUNT_EMAIL: ${GEE_SERVICE_ACCOUNT_EMAIL:-}
      GEE_PRIVATE_KEY_PATH: ${GEE_PRIVATE_KEY_PATH:-/run/secrets/gee-service-account.json}
      
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      PYTHONPATH: /app
    
    volumes:
      - ${GCP_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ~/.oci:/home/opc/.oci:ro
      - ./scripts:/app/scripts:ro
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard
      
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    
    command: >
      bash -c "sleep 35 && 
      celery -A workers.celery_app worker --loglevel=info --queues=analysis --concurrency=1 --max-tasks-per-child=50"
    healthcheck:
      test: [ "CMD-SHELL", "celery -A workers.celery_app inspect ping --timeout=10 2>/dev/null || pgrep -f 'celery.*worker' || exit 1" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Worker 4: VAE (recovery + destruction via GEE)
  worker-vae:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/worker:latest
    container_name: forestguard-worker-vae
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_REPORTS: ${STORAGE_BUCKET_REPORTS}
      STORAGE_BUCKET_CERTIFICATES: ${STORAGE_BUCKET_CERTIFICATES}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}

      OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL}
      OCI_S3_ACCESS_KEY: ${OCI_S3_ACCESS_KEY}
      OCI_S3_SECRET_KEY: ${OCI_S3_SECRET_KEY}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-}
      OCI_CONFIG_FILE: /home/opc/.oci/config

      # Google Earth Engine (requerido para VAE)
      GEE_PROJECT_ID: ${GEE_PROJECT_ID:-}
      GEE_SERVICE_ACCOUNT_EMAIL: ${GEE_SERVICE_ACCOUNT_EMAIL:-}
      GEE_PRIVATE_KEY_PATH: ${GEE_PRIVATE_KEY_PATH:-/run/secrets/gee-service-account.json}

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      PYTHONPATH: /app

    volumes:
      - ${GCP_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ~/.oci:/home/opc/.oci:ro
      - ./scripts:/app/scripts:ro

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - forestguard

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

    command: celery -A workers.celery_app worker --loglevel=info --queues=vae --concurrency=1 --max-tasks-per-child=100
    healthcheck:
      test: [ "CMD-SHELL", "celery -A workers.celery_app inspect ping --timeout=10 2>/dev/null || pgrep -f 'celery.*worker' || exit 1" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Worker 5: Reports (generación PDF)
  worker-reports:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/worker:latest
    container_name: forestguard-worker-reports
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_REPORTS: ${STORAGE_BUCKET_REPORTS}
      STORAGE_BUCKET_CERTIFICATES: ${STORAGE_BUCKET_CERTIFICATES}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}

      OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL}
      OCI_S3_ACCESS_KEY: ${OCI_S3_ACCESS_KEY}
      OCI_S3_SECRET_KEY: ${OCI_S3_SECRET_KEY}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-}
      OCI_CONFIG_FILE: /home/opc/.oci/config
      
      # Google Earth Engine (independiente del storage)
      GEE_PROJECT_ID: ${GEE_PROJECT_ID:-}
      GEE_SERVICE_ACCOUNT_EMAIL: ${GEE_SERVICE_ACCOUNT_EMAIL:-}
      GEE_PRIVATE_KEY_PATH: ${GEE_PRIVATE_KEY_PATH:-/run/secrets/gee-service-account.json}
      
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      PYTHONPATH: /app
    
    volumes:
      - ${GCP_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ~/.oci:/home/opc/.oci:ro
      - ./scripts:/app/scripts:ro
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    
    command: >
      bash -c "sleep 55 && 
      celery -A workers.celery_app worker --loglevel=info --queues=reports,notification --concurrency=2"
    healthcheck:
      test: [ "CMD-SHELL", "celery -A workers.celery_app inspect ping --timeout=10 2>/dev/null || pgrep -f 'celery.*worker' || exit 1" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Celery Beat (scheduler)
  celery-beat:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/worker:latest
    container_name: forestguard-celery-beat
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      PYTHONPATH: /app
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard

    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    
    command: >
      bash -c "sleep 65 && 
      celery -A workers.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule"
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'celery.*beat' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Flower (monitoring dashboard)
  flower:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/worker:latest
    container_name: forestguard-flower
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    
    ports:
      - "5555:5555"
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard
    
    command: >
      bash -c "sleep 75 && 
      celery -A workers.celery_app flower --port=5555"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5555/healthcheck')\" || exit 1" ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend
  frontend:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/frontend:latest
    container_name: forestguard-frontend
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - api
    networks:
      - forestguard
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: forestguard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api
      - frontend
    networks:
      - forestguard
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Certbot para certificados SSL
  certbot:
    image: certbot/certbot:latest
    container_name: forestguard-certbot
    profiles:
      - ssl
    networks:
      - forestguard
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: [ "certbot" ]
    restart: "no"

networks:
  forestguard:
    driver: bridge

volumes:
  redis_data:
    driver: local