services:
  # PostgreSQL + PostGIS (via Supabase/remote)
  # Configurado por variable de entorno DB_HOST
  
  redis:
    image: redis:7-alpine
    container_name: forestguard-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - forestguard
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/api:latest
    container_name: forestguard-api
    restart: unless-stopped
    environment:
      # Base de datos
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # LEGACY (GCS) — OCI is the active storage backend
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_REPORTS: ${STORAGE_BUCKET_REPORTS}
      STORAGE_BUCKET_CERTIFICATES: ${STORAGE_BUCKET_CERTIFICATES}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}

      # OCI Object Storage (S3-compatible — Principal)
      OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL}
      OCI_S3_ACCESS_KEY: ${OCI_S3_ACCESS_KEY}
      OCI_S3_SECRET_KEY: ${OCI_S3_SECRET_KEY}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-}
      OCI_CONFIG_FILE: /home/opc/.oci/config

      # Google Earth Engine (independent from storage)
      GEE_PROJECT_ID: ${GEE_PROJECT_ID:-}
      GEE_SERVICE_ACCOUNT_EMAIL: ${GEE_SERVICE_ACCOUNT_EMAIL:-}
      GEE_PRIVATE_KEY_PATH: ${GEE_PRIVATE_KEY_PATH:-/run/secrets/gee-service-account.json}

      # Celery/Redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      
      # Aplicación
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY}

      # Auth — API Key + Supabase JWT
      API_KEY: ${API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
    
    # Monta credenciales de GCS (ADC local) y OCI config
    volumes:
      - ${GCP_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ~/.config/gcloud:/home/user/.config/gcloud:ro
      - ~/.oci:/home/opc/.oci:ro
    
    ports:
      - "8000:8000"
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard
    
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 15s
      retries: 6
      start_period: 120s  # Increased from 60s

  # Worker 1: Ingestion (Descarga FIRMS)
  worker-ingestion:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/worker:latest
    container_name: forestguard-worker-ingestion
    environment:
      # Base de datos
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_REPORTS: ${STORAGE_BUCKET_REPORTS}
      STORAGE_BUCKET_CERTIFICATES: ${STORAGE_BUCKET_CERTIFICATES}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      
      # OCI Object Storage (S3-compatible — Principal)
      OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL}
      OCI_S3_ACCESS_KEY: ${OCI_S3_ACCESS_KEY}
      OCI_S3_SECRET_KEY: ${OCI_S3_SECRET_KEY}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-}
      OCI_CONFIG_FILE: /home/opc/.oci/config
      
      # Celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      
      # NASA FIRMS
      FIRMS_API_KEY: ${FIRMS_API_KEY}
      
      # Aplicación
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      PYTHONPATH: /app
    
    volumes:
      - ${GCP_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ~/.config/gcloud:/home/user/.config/gcloud:ro
      - ~/.oci:/home/opc/.oci:ro
      - ./scripts:/app/scripts:ro
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard
    
    command: >
      bash -c "sleep 30 && 
      celery -A workers.celery_app worker --loglevel=info --queues=ingestion --concurrency=2"
    healthcheck:
      test: [ "CMD", "celery", "-A", "workers.celery_app", "inspect", "ping" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

  # Worker 2: Clustering (DBSCAN)
  worker-clustering:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/worker:latest
    container_name: forestguard-worker-clustering
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_REPORTS: ${STORAGE_BUCKET_REPORTS}
      STORAGE_BUCKET_CERTIFICATES: ${STORAGE_BUCKET_CERTIFICATES}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      
      # OCI Object Storage (S3-compatible — Principal)
      OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL}
      OCI_S3_ACCESS_KEY: ${OCI_S3_ACCESS_KEY}
      OCI_S3_SECRET_KEY: ${OCI_S3_SECRET_KEY}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-}
      OCI_CONFIG_FILE: /home/opc/.oci/config
      
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      PYTHONPATH: /app
    
    volumes:
      - ${GCP_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ~/.oci:/home/opc/.oci:ro
      - ./scripts:/app/scripts:ro
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard
    
    command: >
      bash -c "sleep 45 && 
      celery -A workers.celery_app worker --loglevel=info --queues=clustering --concurrency=2"
    healthcheck:
      test: [ "CMD", "celery", "-A", "workers.celery_app", "inspect", "ping" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

  # Worker 3: Analysis (Carousel + Recovery + Destruction)
  worker-analysis:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/worker:latest
    container_name: forestguard-worker-analysis
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_REPORTS: ${STORAGE_BUCKET_REPORTS}
      STORAGE_BUCKET_CERTIFICATES: ${STORAGE_BUCKET_CERTIFICATES}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      
      # OCI Object Storage (S3-compatible — Principal)
      OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL}
      OCI_S3_ACCESS_KEY: ${OCI_S3_ACCESS_KEY}
      OCI_S3_SECRET_KEY: ${OCI_S3_SECRET_KEY}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-}
      OCI_CONFIG_FILE: /home/opc/.oci/config
      
      # Google Earth Engine (independent from storage)
      GEE_PROJECT_ID: ${GEE_PROJECT_ID:-}
      GEE_SERVICE_ACCOUNT_EMAIL: ${GEE_SERVICE_ACCOUNT_EMAIL:-}
      GEE_PRIVATE_KEY_PATH: ${GEE_PRIVATE_KEY_PATH:-/run/secrets/gee-service-account.json}
      
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      PYTHONPATH: /app
    
    volumes:
      - ${GCP_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ~/.oci:/home/opc/.oci:ro
      - ./scripts:/app/scripts:ro
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard
    
    command: >
      bash -c "sleep 60 && 
      celery -A workers.celery_app worker --loglevel=info --queues=analysis --concurrency=1"
    healthcheck:
      test: [ "CMD", "celery", "-A", "workers.celery_app", "inspect", "ping" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

  # Worker 4: VAE (Recovery + Destruction via GEE)
  worker-vae:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/worker:latest
    container_name: forestguard-worker-vae
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_REPORTS: ${STORAGE_BUCKET_REPORTS}
      STORAGE_BUCKET_CERTIFICATES: ${STORAGE_BUCKET_CERTIFICATES}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}

      # OCI Object Storage (S3-compatible)
      OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL}
      OCI_S3_ACCESS_KEY: ${OCI_S3_ACCESS_KEY}
      OCI_S3_SECRET_KEY: ${OCI_S3_SECRET_KEY}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-}
      OCI_CONFIG_FILE: /home/opc/.oci/config

      # Google Earth Engine (required for VAE workers)
      GEE_PROJECT_ID: ${GEE_PROJECT_ID:-}
      GEE_SERVICE_ACCOUNT_EMAIL: ${GEE_SERVICE_ACCOUNT_EMAIL:-}
      GEE_PRIVATE_KEY_PATH: ${GEE_PRIVATE_KEY_PATH:-/run/secrets/gee-service-account.json}

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      PYTHONPATH: /app

    volumes:
      - ${GCP_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ~/.oci:/home/opc/.oci:ro
      - ./scripts:/app/scripts:ro

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - forestguard

    command: >
      bash -c "sleep 75 && 
      celery -A workers.celery_app worker --loglevel=info --queues=vae --concurrency=1 --max-tasks-per-child=100"
    healthcheck:
      test: [ "CMD", "celery", "-A", "workers.celery_app", "inspect", "ping" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

  # Worker 5: Reports (PDF generation)
  worker-reports:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/worker:latest
    container_name: forestguard-worker-reports
    restart: unless-stopped
    environment:
      # Base de datos
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_REPORTS: ${STORAGE_BUCKET_REPORTS}
      STORAGE_BUCKET_CERTIFICATES: ${STORAGE_BUCKET_CERTIFICATES}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}

      # OCI Object Storage (S3-compatible — Principal)
      OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL}
      OCI_S3_ACCESS_KEY: ${OCI_S3_ACCESS_KEY}
      OCI_S3_SECRET_KEY: ${OCI_S3_SECRET_KEY}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-}
      OCI_CONFIG_FILE: /home/opc/.oci/config
      
      # Google Earth Engine (independent from storage)
      GEE_PROJECT_ID: ${GEE_PROJECT_ID:-}
      GEE_SERVICE_ACCOUNT_EMAIL: ${GEE_SERVICE_ACCOUNT_EMAIL:-}
      GEE_PRIVATE_KEY_PATH: ${GEE_PRIVATE_KEY_PATH:-/run/secrets/gee-service-account.json}
      
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
    
    volumes:
      - ${GCP_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ~/.oci:/home/opc/.oci:ro
      - ./scripts:/app/scripts:ro
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard
    
    command: >
      bash -c "sleep 90 && 
      celery -A workers.celery_app worker --loglevel=info --queues=reports,notification --concurrency=2"
    healthcheck:
      test: [ "CMD", "celery", "-A", "workers.celery_app", "inspect", "ping" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

  # Celery Beat (scheduler)
  celery-beat:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/worker:latest
    container_name: forestguard-celery-beat
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      PYTHONPATH: /app
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard
    
    command: >
      bash -c "sleep 105 && 
      celery -A workers.celery_app beat --loglevel=info -s /tmp/celerybeat-schedule"
    healthcheck:
      test: [ "CMD", "celery", "-A", "workers.celery_app", "inspect", "ping" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

  # Flower (monitoring dashboard)
  flower:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/worker:latest
    container_name: forestguard-flower
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    
    ports:
      - "5555:5555"
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard
    
    command: >
      bash -c "sleep 120 && 
      celery -A workers.celery_app flower --port=5555"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5555/healthcheck')\" || exit 1" ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

  # Frontend
  frontend:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/frontend:latest
    container_name: forestguard-frontend
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - api
    networks:
      - forestguard
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: forestguard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api
      - frontend
    networks:
      - forestguard
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:

networks:
  forestguard:
    driver: bridge
