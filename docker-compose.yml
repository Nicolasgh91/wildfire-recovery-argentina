services:
  # PostgreSQL + PostGIS (via Supabase/remote)
  # Configurado por variable de entorno DB_HOST
  
  redis:
    image: redis:7-alpine
    container_name: forestguard-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - forestguard
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/backend:latest
    container_name: forestguard-api
    environment:
      # Base de datos
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # GCS (con ADC) - Mantener para compatibilidad
      # /home/user/.config/gcloud/application_default_credentials.json
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/gcp-sa.json}
      GCS_SERVICE_ACCOUNT_JSON: ${GCS_SERVICE_ACCOUNT_JSON:-/run/secrets/gcp-sa.json}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_REPORTS: ${STORAGE_BUCKET_REPORTS}
      STORAGE_BUCKET_CERTIFICATES: ${STORAGE_BUCKET_CERTIFICATES}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}

      # OCI Object Storage (S3-compatible — Principal)
      OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL}
      OCI_S3_ACCESS_KEY: ${OCI_S3_ACCESS_KEY}
      OCI_S3_SECRET_KEY: ${OCI_S3_SECRET_KEY}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-}
      OCI_CONFIG_FILE: /home/opc/.oci/config

      # Celery/Redis
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      
      # Aplicación
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY}
    
    # Monta credenciales de GCS (ADC local) y OCI config
    volumes:
      - ${GCP_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ~/.config/gcloud:/home/user/.config/gcloud:ro
      - ~/.oci:/home/opc/.oci:ro
    
    ports:
      - "8000:8000"
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard
    
    # Production: use image default CMD (no --reload).
    # For local dev, add --reload via docker-compose.override.yml.
    
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Worker 1: Ingestion (Descarga FIRMS)
  worker-ingestion:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/backend:latest
    container_name: forestguard-worker-ingestion
    environment:
      # Base de datos
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # GCS
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/gcp-sa.json}
      GCS_SERVICE_ACCOUNT_JSON: ${GCS_SERVICE_ACCOUNT_JSON:-/run/secrets/gcp-sa.json}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_REPORTS: ${STORAGE_BUCKET_REPORTS}
      STORAGE_BUCKET_CERTIFICATES: ${STORAGE_BUCKET_CERTIFICATES}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      
      # OCI Object Storage (S3-compatible — Principal)
      OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL}
      OCI_S3_ACCESS_KEY: ${OCI_S3_ACCESS_KEY}
      OCI_S3_SECRET_KEY: ${OCI_S3_SECRET_KEY}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-}
      
      # OCI Object Storage (Principal)
      OCI_CONFIG_FILE: /home/opc/.oci/config
      
      # Celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      
      # NASA FIRMS
      FIRMS_API_KEY: ${FIRMS_API_KEY}
      
      # Aplicación
      ENVIRONMENT: ${ENVIRONMENT:-production}
    
    volumes:
      - ${GCP_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ~/.config/gcloud:/home/user/.config/gcloud:ro
      - ~/.oci:/home/opc/.oci:ro
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard
    
    command: celery -A workers.celery_app worker --loglevel=info --queues=ingestion --concurrency=2

  # Worker 2: Clustering (DBSCAN)
  worker-clustering:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/backend:latest
    container_name: forestguard-worker-clustering
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/gcp-sa.json}
      GCS_SERVICE_ACCOUNT_JSON: ${GCS_SERVICE_ACCOUNT_JSON:-/run/secrets/gcp-sa.json}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_REPORTS: ${STORAGE_BUCKET_REPORTS}
      STORAGE_BUCKET_CERTIFICATES: ${STORAGE_BUCKET_CERTIFICATES}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      
      # OCI Object Storage (S3-compatible — Principal)
      OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL}
      OCI_S3_ACCESS_KEY: ${OCI_S3_ACCESS_KEY}
      OCI_S3_SECRET_KEY: ${OCI_S3_SECRET_KEY}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-}

      # OCI Object Storage (Principal)
      OCI_CONFIG_FILE: /home/opc/.oci/config
      
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      
      ENVIRONMENT: ${ENVIRONMENT:-production}
    
    volumes:
      - ${GCP_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ~/.config/gcloud:/home/user/.config/gcloud:ro
      - ~/.oci:/home/opc/.oci:ro
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard
    
    command: celery -A workers.celery_app worker --loglevel=info --queues=clustering --concurrency=2

  # Worker 3: Analysis (Recovery + Destruction)
  worker-analysis:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/backend:latest
    container_name: forestguard-worker-analysis
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/gcp-sa.json}
      GCS_SERVICE_ACCOUNT_JSON: ${GCS_SERVICE_ACCOUNT_JSON:-/run/secrets/gcp-sa.json}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_REPORTS: ${STORAGE_BUCKET_REPORTS}
      STORAGE_BUCKET_CERTIFICATES: ${STORAGE_BUCKET_CERTIFICATES}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
      
      # OCI Object Storage (S3-compatible — Principal)
      OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL}
      OCI_S3_ACCESS_KEY: ${OCI_S3_ACCESS_KEY}
      OCI_S3_SECRET_KEY: ${OCI_S3_SECRET_KEY}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-}

      # OCI Object Storage (Principal)
      OCI_CONFIG_FILE: /home/opc/.oci/config
      
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      
      ENVIRONMENT: ${ENVIRONMENT:-production}
    
    volumes:
      - ${GCP_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ~/.config/gcloud:/home/user/.config/gcloud:ro
      - ~/.oci:/home/opc/.oci:ro
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard
    
    command: celery -A workers.celery_app worker --loglevel=info --queues=analysis --concurrency=1

  # Worker 4: Reports (PDF generation)
  worker-reports:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/backend:latest
    container_name: forestguard-worker-reports
    restart: unless-stopped
    environment:
      # Base de datos
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # GCS (legacy — kept for compatibility)
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/gcp-sa.json}
      GCS_SERVICE_ACCOUNT_JSON: ${GCS_SERVICE_ACCOUNT_JSON:-/run/secrets/gcp-sa.json}
      GCS_PROJECT_ID: ${GCS_PROJECT_ID}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oci}
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_REPORTS: ${STORAGE_BUCKET_REPORTS}
      STORAGE_BUCKET_CERTIFICATES: ${STORAGE_BUCKET_CERTIFICATES}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}

      # OCI Object Storage (S3-compatible — Principal)
      OCI_S3_ENDPOINT_URL: ${OCI_S3_ENDPOINT_URL}
      OCI_S3_ACCESS_KEY: ${OCI_S3_ACCESS_KEY}
      OCI_S3_SECRET_KEY: ${OCI_S3_SECRET_KEY}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_PUBLIC_URL: ${OCI_PUBLIC_URL:-}
      OCI_CONFIG_FILE: /home/opc/.oci/config
      
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      
      ENVIRONMENT: ${ENVIRONMENT:-production}
    
    volumes:
      - ${GCP_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
      - ~/.config/gcloud:/home/user/.config/gcloud:ro
      - ~/.oci:/home/opc/.oci:ro
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard
    
    command: celery -A workers.celery_app worker --loglevel=info --queues=reports --concurrency=2

  # Celery Beat (scheduler)
  celery-beat:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/backend:latest
    container_name: forestguard-celery-beat
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      ENVIRONMENT: ${ENVIRONMENT:-production}
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard
    
    command: celery -A workers.celery_app beat --loglevel=info

  # Flower (monitoring dashboard)
  flower:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/backend:latest
    container_name: forestguard-flower
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    
    ports:
      - "5555:5555"
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - forestguard
    
    command: celery -A workers.celery_app flower --port=5555

  # Frontend
  # For production deployment with CI-built images:
  # 1. Comment/remove the 'build' section below
  # 2. Add: image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/frontend:latest
  # 3. Remove or rename docker-compose.override.yml
  # See: docs/deployment/ci-frontend-deployment.md
  frontend:
    image: ghcr.io/nicolasgh91/wildfire-recovery-argentina/frontend:latest
    container_name: forestguard-frontend
    restart: unless-stopped
    # Runtime memory limit: nginx serving static files needs < 30 MB
    mem_limit: 64m
    depends_on:
      - api
    networks:
      - forestguard
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: forestguard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api
      - frontend
    networks:
      - forestguard
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot:latest
    container_name: forestguard-certbot
    # Run on demand via `docker compose --profile ssl run --rm certbot ...`
    profiles:
      - ssl
    networks:
      - forestguard
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: [ "certbot" ]
    restart: "no"

networks:
  forestguard:
    driver: bridge

volumes:
  redis_data:
    driver: local