name: Frontend Build & Push (Multi-architecture)

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  workflow_dispatch:
    inputs:
      clean_rebuild:
        description: 'Run a one-off clean multi-arch build without cache'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  build-and-push:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    # Dependabot PRs no tienen acceso a repository secrets — saltar el job completo.
    # El build real ocurre cuando el PR se mergea a main.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Sin "ref: main" — se hace checkout del commit que disparó el evento.
        # En PRs: checkout del HEAD del PR (para validar el código del PR).
        # En push a main: checkout del commit mergeado.

      - name: Print ref and SHA
        run: |
          echo "github.ref=${GITHUB_REF}"
          echo "github.sha=${GITHUB_SHA}"
          git rev-parse --short HEAD

      - name: Guardrail - block forbidden FirePopupCard import
        working-directory: ./frontend
        run: |
          if grep -R -nE \
            --exclude-dir=__tests__ \
            --exclude='*.test.*' \
            --exclude='*.spec.*' \
            "@/components/map/FirePopupCard" \
            src; then
            echo "::error::Forbidden FirePopupCard import found under frontend/src"
            exit 1
          fi

      - name: Validate required build secrets
        run: |
          missing=""
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            missing="$missing VITE_SUPABASE_URL"
          fi
          if [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            missing="$missing VITE_SUPABASE_ANON_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub Secrets:$missing"
            echo "Add them at: Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          echo "All required build secrets are present."

      - name: Descargar artefactos SSG desde OCI (con fallback)
        working-directory: ./frontend
        env:
          SSG_ROUTES_URL: ${{ secrets.SSG_ROUTES_OCI_URL }}
          SSG_SEO_DATA_URL: ${{ secrets.SSG_SEO_DATA_OCI_URL }}
        run: |
          set -e
          mkdir -p public

          if ! curl -fsSL "$SSG_ROUTES_URL" -o public/ssg-routes.json; then
            cat > public/ssg-routes.json <<'JSON'
          {
            "generated_at": "fallback",
            "static_routes": ["/metodologia", "/acerca"],
            "province_routes": [],
            "zone_routes": [],
            "episode_routes": [],
            "total": 2
          }
          JSON
          fi

          if ! curl -fsSL "$SSG_SEO_DATA_URL" -o public/ssg-seo-data.json; then
            cat > public/ssg-seo-data.json <<'JSON'
          {
            "generated_at": "fallback",
            "episodes": {}
          }
          JSON
          fi

          if command -v jq >/dev/null 2>&1; then
            echo "Rutas SSG: $(jq '.total' public/ssg-routes.json)"
            echo "Slugs SEO: $(jq '.episodes | length' public/ssg-seo-data.json)"
          else
            echo "jq no está disponible; omitiendo métricas de JSON."
          fi

      - name: Verificar tamaño de artefactos SSG
        working-directory: ./frontend
        run: |
          set -e
          if [ -f public/ssg-seo-data.json ]; then
            SIZE=$(stat -c%s public/ssg-seo-data.json 2>/dev/null || echo 0)
            echo "Tamaño ssg-seo-data.json: $((SIZE / 1024)) KB"
            if [ "$SIZE" -gt $((10 * 1024 * 1024)) ]; then
              echo "::warning::ssg-seo-data.json supera 10 MB ($((SIZE / 1024 / 1024)) MB). Considerar snapshot incremental o partición por rango temporal."
            fi
          else
            echo "public/ssg-seo-data.json no existe; omitiendo verificación de tamaño."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (for multi-architecture builds)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (Multi-architecture, cached)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.clean_rebuild == 'true') }}
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_API_KEY=${{ secrets.VITE_API_KEY }}
            VITE_AUTH_REDIRECT_URL=${{ secrets.VITE_AUTH_REDIRECT_URL }}

      - name: Build and push (Multi-architecture, clean rebuild)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_rebuild == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_API_KEY=${{ secrets.VITE_API_KEY }}
            VITE_AUTH_REDIRECT_URL=${{ secrets.VITE_AUTH_REDIRECT_URL }}