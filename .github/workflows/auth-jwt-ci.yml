name: Auth JWT Smoke

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - ".github/workflows/auth-jwt-ci.yml"
      - "app/**"
      - "requirements.txt"
      - "pyproject.toml"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - ".github/workflows/auth-jwt-ci.yml"
      - "app/**"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-jwt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_JWT_AUDIENCE: authenticated
      API_KEY: ci-only-api-key
      ADMIN_API_KEY: ci-admin-key
      SECRET_KEY: ci-secret-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DB smoke check
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          db_url = os.environ["DATABASE_URL"]
          engine = create_engine(db_url, future=True)
          with engine.connect() as conn:
              value = conn.execute(text("SELECT 1")).scalar_one()
          assert value == 1, f"Unexpected DB result: {value}"
          print("DB smoke check passed")
          PY

      - name: Auth JWT smoke check
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)

          health = client.get("/health")
          assert health.status_code == 200, f"/health expected 200, got {health.status_code}"

          no_auth = client.get("/api/v1/audit/geocode?q=chubut")
          assert no_auth.status_code == 401, f"no auth expected 401, got {no_auth.status_code} | body={no_auth.text}"

          invalid_jwt = client.get(
              "/api/v1/audit/geocode?q=chubut",
              headers={"Authorization": "Bearer invalid.token.value"},
          )
          assert invalid_jwt.status_code == 401, f"invalid jwt expected 401, got {invalid_jwt.status_code} | body={invalid_jwt.text}"

          only_api_key = client.get(
              "/api/v1/audit/geocode?q=chubut",
              headers={"X-API-Key": "ci-only-api-key"},
          )
          assert only_api_key.status_code == 401, f"api-key-only expected 401, got {only_api_key.status_code} | body={only_api_key.text}"

          print("Auth JWT smoke check passed")
          PY
