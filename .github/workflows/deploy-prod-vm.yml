name: Deploy to production VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prod-vm-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production VM
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight — validate required secrets
        env:
          PROD_VM_HOST:        ${{ secrets.PROD_VM_HOST }}
          PROD_VM_USER:        ${{ secrets.PROD_VM_USER }}
          PROD_VM_SSH_KEY:     ${{ secrets.PROD_VM_SSH_KEY }}
          PROD_VM_KNOWN_HOSTS: ${{ secrets.PROD_VM_KNOWN_HOSTS }}
        run: |
          missing=()
          [[ -z "$PROD_VM_HOST"        ]] && missing+=("PROD_VM_HOST")
          [[ -z "$PROD_VM_USER"        ]] && missing+=("PROD_VM_USER")
          [[ -z "$PROD_VM_SSH_KEY"     ]] && missing+=("PROD_VM_SSH_KEY")
          [[ -z "$PROD_VM_KNOWN_HOSTS" ]] && missing+=("PROD_VM_KNOWN_HOSTS")

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: Missing required secrets in GitHub Environment 'production':"
            printf '  - %s\n' "${missing[@]}"
            echo "Configure them at:"
            echo "  GitHub → Settings → Environments → production → Environment secrets"
            exit 1
          fi

          echo "Preflight passed."
          echo "  Commit : ${{ github.sha }}"
          echo "  Host   : $PROD_VM_HOST"
          echo "  Trigger: ${{ github.event_name }}"

      - name: Set up SSH (multiplexed)
        env:
          PROD_VM_SSH_KEY:     ${{ secrets.PROD_VM_SSH_KEY }}
          PROD_VM_KNOWN_HOSTS: ${{ secrets.PROD_VM_KNOWN_HOSTS }}
          VM_HOST:             ${{ secrets.PROD_VM_HOST }}
          VM_USER:             ${{ secrets.PROD_VM_USER }}
          VM_PORT:             ${{ secrets.PROD_VM_PORT }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$PROD_VM_SSH_KEY" > ~/.ssh/prod_vm_key
          chmod 600 ~/.ssh/prod_vm_key

          printf '%s\n' "$PROD_VM_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          PORT="${VM_PORT:-22}"
          cat > ~/.ssh/config << EOF
          Host prod
            HostName ${VM_HOST}
            User ${VM_USER}
            Port ${PORT}
            IdentityFile ~/.ssh/prod_vm_key
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 60
            ServerAliveInterval 15
            ServerAliveCountMax 6
            ControlMaster auto
            ControlPersist 10m
            ControlPath ~/.ssh/cm-%C
          EOF
          chmod 600 ~/.ssh/config

          # Establecer conexión maestra
          ssh -fN prod
          echo "SSH multiplexed connection established"

      - name: VM Preflight — disk space and Docker daemon
        run: |
          ssh prod bash -s << 'REMOTE_SCRIPT'
          set -euo pipefail

          echo "=== Disk usage ==="
          DISK_USE=$(df / | awk 'NR==2 {gsub("%","",$5); print $5}')
          echo "Root filesystem: ${DISK_USE}% used"

          if [[ "$DISK_USE" -gt 85 ]]; then
            echo "ERROR: Disk is ${DISK_USE}% full — deploy aborted."
            echo "Run: docker system prune -af --volumes"
            exit 1
          fi
          [[ "$DISK_USE" -gt 70 ]] && echo "WARNING: Disk at ${DISK_USE}%"

          echo "=== Docker daemon health ==="
          if ! timeout 15 docker info > /dev/null 2>&1; then
            echo "WARNING: Docker daemon is not responding. Attempting auto-remediation..."
            echo "=== DIAGNOSTIC: System resources ==="
            timeout 5 free -m || true
            timeout 5 df -h || true
            
            echo "Restarting Docker daemon..."
            sudo systemctl restart docker || true
            sleep 10
            
            echo "Aggressively killing all running containers to free memory..."
            timeout 20 docker ps -q | xargs -r docker kill || true
            
            # Wait for memory to reclaim
            sleep 5
            
            if ! timeout 15 docker info > /dev/null 2>&1; then
              echo "ERROR: Auto-remediation failed! Docker is still a zombie."
              timeout 10 journalctl -u docker -n 200 --no-pager || true
              timeout 5 free -m || true
              exit 1
            fi
            echo "Auto-remediation succeeded. Docker is breathing again."
          fi
          echo "Docker daemon OK"

          echo "=== Cleanup (dangling only) ==="
          timeout 30 docker container prune -f || echo "WARNING: docker container prune timed out"
          # 2. Remove dangling (untagged) images
          timeout 30 docker image prune -f || echo "WARNING: docker image prune timed out"

          # Limpieza agresiva solo si hay presión de disco real
          DISK_USE=$(df / | awk 'NR==2 {gsub("%","",$5); print $5}')
          if [[ "$DISK_USE" -gt 85 ]]; then
            echo "Disk pressure — aggressive cleanup..."
            timeout 60 docker builder prune -af || echo "WARNING: docker builder prune timed out"
            timeout 60 docker image prune -af || echo "WARNING: docker image prune timed out"
          fi

          timeout 30 docker system df 2>/dev/null || echo "WARNING: docker system df timed out"
          REMOTE_SCRIPT

      - name: Deploy via SSH
        run: |
          ssh prod bash -s << 'REMOTE_SCRIPT'
          set -euo pipefail
          APP_DIR="/home/opc"

          echo "=== Deploy started at $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

          if [[ ! -d "${APP_DIR}/.git" ]]; then
            echo "ERROR: ${APP_DIR} is not a git repository."
            exit 1
          fi

          cd "$APP_DIR"

          if ! git diff --quiet HEAD 2>/dev/null; then
            echo "ERROR: Uncommitted changes detected."
            git diff --name-only HEAD
            exit 1
          fi

          if [[ -f docker-compose.override.yml ]]; then
            echo "ERROR: docker-compose.override.yml found. Rename it."
            exit 1
          fi

          git fetch --prune origin
          git checkout main
          git pull --ff-only origin main
          echo "Repo updated: $(git log -1 --pretty='%H %s')"

          chmod +x scripts/deploy.sh scripts/setup-ssl.sh \
            scripts/renew-ssl.sh scripts/renew-ssl-cron.sh scripts/verify-ssl.sh

          echo "=== Executing deploy.sh ==="
          ./scripts/deploy.sh

          echo "=== Deploy completed at $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
          REMOTE_SCRIPT

      - name: Post-deploy health check
        run: |
          ssh prod bash -s << 'REMOTE_SCRIPT'
          set -euo pipefail
          cd /home/opc

          echo "=== Container status ==="
          docker compose ps

          echo "=== Health check (with retry) ==="
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3..."
            if curl -fsS -L --max-time 20 http://localhost/health 2>/dev/null; then
              echo "Health check passed"
              exit 0
            fi
            if curl -fsS --insecure --max-time 20 https://localhost/health 2>/dev/null; then
              echo "Health check passed (HTTPS)"
              exit 0
            fi
            echo "Health check failed, waiting 15s..."
            sleep 15
          done
          echo "ERROR: Health check failed after 3 attempts"
          docker compose logs --tail=30 api nginx 2>/dev/null || true
          exit 1
          REMOTE_SCRIPT

      - name: Diagnostic logs on failure
        if: failure()
        run: |
          ssh prod bash -s << 'REMOTE_SCRIPT' || true
          set -uo pipefail
          echo "=== DIAGNOSTIC: Container status ==="
          docker compose -f /home/opc/docker-compose.yml ps -a 2>/dev/null || true
          echo "=== DIAGNOSTIC: API logs ==="
          docker compose -f /home/opc/docker-compose.yml logs --tail=200 api 2>/dev/null || true
          echo "=== DIAGNOSTIC: Nginx logs ==="
          docker compose -f /home/opc/docker-compose.yml logs --tail=120 nginx 2>/dev/null || true
          echo "=== DIAGNOSTIC: API Container Inspect ==="
          docker inspect forestguard-api --format 'Status: {{.State.Status}} OOMKilled: {{.State.OOMKilled}} ExitCode: {{.State.ExitCode}}' 2>/dev/null || true
          echo "=== DIAGNOSTIC: Docker Stats ==="
          docker stats --no-stream 2>/dev/null || true
          echo "=== DIAGNOSTIC: Docker daemon ==="
          systemctl status docker --no-pager -l 2>/dev/null || true
          REMOTE_SCRIPT

      - name: Cleanup SSH
        if: always()
        run: ssh -O exit prod 2>/dev/null || true
